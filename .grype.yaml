# Grype ignore rules (native config format, consumed by `build`'s Stage 4b
# via `--config /.grype.yaml`). `.grypeignore` is a human-readable mirror
# that nothing reads; keep both in sync. Every entry must be documented in
# SECURITY.md.
#
# 2026-11-15: pruned to one entry. The image no longer installs pip
# packages or keeps perl, pip, or setuptools, and `dnf upgrade
# --releasever=latest` reaches every fixed AL2023 RPM. An unsuppressed Grype
# scan reports only the entry below.
#
# Add new entries only after confirming with
# `dnf --releasever=latest list --showduplicates <pkg>` that no fixed build
# exists. Give each entry a dated justification comment.

ignore:
  # 2026-11-15: python3-urllib3 1.25.10-5.amzn2023.0.9 (latest AL2023
  # build) is a runtime dependency of awscli-2. AL2023 backports fixes
  # without bumping the "1.25.10" version string that Grype matches.
  # CVE-2021-33503: AL2023 rates the package "Not Affected"
  # (alas.aws.amazon.com). Same entry as ha-offsite-backups and
  # pg-volume-backup.
  - vulnerability: GHSA-q2q7-5pp4-w6pg
    package:
      name: urllib3
      type: python
